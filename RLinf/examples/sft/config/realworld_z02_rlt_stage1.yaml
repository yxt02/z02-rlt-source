defaults:
  - model/pi0_5@actor.model
  - hybrid_engines/openpi_fsdp@actor.fsdp_config
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-1

runner:
  task_type: sft
  logger:
    log_path: ${oc.env:Z02_RLT_RUN_DIR}
    project_name: rlinf-rlt
    experiment_name: stage1
    logger_backends: [tensorboard]
  max_epochs: -1
  max_steps: 4000
  val_check_interval: -1
  save_interval: 500

data:
  train_data_paths: []
  num_workers: 4

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 8
  seed: 42
  model:
    precision: fp32
    model_path: ${oc.env:Z02_RLT_MODEL_PATH}
    action_dim: 25
    num_action_chunks: 50
    num_steps: 4
    openpi_data:
      norm_stats_path: ${oc.env:Z02_RLT_NORM_STATS}
      default_prompt: ${oc.env:Z02_RLT_PROMPT}
    openpi:
      config_name: pi05_z02_rlt
      task: sft
      torch_compile: false
      embed_dtype: bf16
      num_images_in_input: 3
      action_horizon: 50
      discrete_state_input: true
      use_rlt: true
      rlt_alpha: 1.0
      rlt_prefix_seq_len: 1024
      rlt_image_only: false
      rlt_use_mask: true

  optim:
    lr: 1.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: ${runner.max_steps}
    lr_warmup_steps: 250
    lr_scheduler: cosine
    num_cycles: 0.5
    min_lr: 1.0e-6

  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    use_orig_params: true
    gradient_checkpointing: true
    gradient_checkpointing_use_reentrant: false
    wrappers:
      rlt_features:
        module_names: [rlt_module]
        wrap_mode: subtree
    mixed_precision_rules:
      rlt_features: fp32
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32
