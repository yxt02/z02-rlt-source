defaults:
  - env/realworld_z02_pour_water@env.train
  - env/realworld_z02_pour_water@env.eval
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0
    rollout: 0
    env:
      node_group: node
      placement: 0

runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:Z02_RLT_RUN_DIR}
    project_name: rlinf-rlt
    experiment_name: stage2
    logger_backends: [tensorboard]
  max_steps: 1000
  max_epochs: ${runner.max_steps}
  only_eval: false
  val_check_interval: -1
  save_interval: 50
  resume_dir: null
  ckpt_path: null

algorithm:
  update_epoch: 8
  group_size: 1
  agg_q: min
  actor_agg_q: q1
  q_head_type: default
  enable_drq: false
  adv_type: embodied_sac
  loss_type: rlt_ac
  loss_agg_func: token-mean
  q_weight: 0.1
  bc_weight: 5
  reference_dropout_prob: 0.5
  bootstrap_type: standard
  gamma: 0.96
  tau: 0.005
  entropy_tuning:
    alpha_type: fixed_alpha
    initial_alpha: 0.0
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0
  replay_buffer:
    enable_cache: true
    cache_size: 200
    min_buffer_size: 2
    sample_window_size: 200
    auto_save: false
  target_update_freq: 1
  target_update_type: all
  train_actor_steps: 2
  critic_actor_ratio: 4
  critic_subsample_size: 0
  backup_entropy: false

env:
  group_name: EnvGroup
  # Keep shutdown responsive while waiting for manual ready.
  threaded_io: true

rollout:
  group_name: RolloutGroup
  rollout_backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1
  collect_transitions: true
  collect_prev_infos: false
  enable_torch_compile: false
  enable_cuda_graph: false

  model:
    model_path: null
    precision: fp32
    action_dim: 18
    num_action_chunks: 10
    ref_num_action_chunks: 20

  rlt_feature_model:
    model_type: openpi
    model_path: ${oc.env:Z02_RLT_MODEL_PATH}
    precision: bf16
    is_lora: false
    num_action_chunks: 20
    action_dim: 18
    num_steps: 4
    add_value_head: false
    openpi_data:
      norm_stats_path: ${oc.env:Z02_RLT_NORM_STATS}
      default_prompt: ${oc.env:Z02_RLT_PROMPT}
    openpi:
      task: eval
      config_name: pi05_z02_rlt
      torch_compile: false
      num_images_in_input: 3
      action_horizon: 50
      action_chunk: 20
      action_env_dim: 18
      num_steps: 4
      model_action_dim: 32
      paligemma_variant: gemma_2b
      action_expert_variant: gemma_300m
      max_token_len: 200
      discrete_state_input: true
      use_rlt: true
      rlt_prefix_seq_len: 1024
      rlt_image_only: false
      rlt_use_mask: true

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 32
  global_batch_size: 32
  seed: 1234
  enable_offload: false
  model:
    model_type: rlt_mlp_policy
    model_path: null
    precision: fp32
    add_value_head: false
    add_q_head: true
    q_head_type: default
    fixed_std: 0.05
    is_lora: false
    z_dim: 2048
    proprio_dim: 25
    action_dim: 18
    reference_action_scale:
      [0.15, 0.15, 0.15, 0.15, 0.15, 0.15, 0.15, 1.0,
       0.15, 0.15, 0.15, 0.15, 0.15, 0.15, 0.15, 1.0,
       0.15, 0.15]
    num_action_chunks: 10
    ref_num_action_chunks: 20
  optim:
    clip_grad: 10.0
    lr: 3.0e-4
    lr_scheduler: torch_constant
  critic_optim:
    clip_grad: 10.0
    lr: 3.0e-4
    lr_scheduler: torch_constant
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    mixed_precision:
      param_dtype: fp32
      reduce_dtype: fp32
      buffer_dtype: fp32

reward:
  use_reward_model: false

critic:
  use_critic_model: false
